name: Publish to PyPI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          mkdir -p fincheck_pkg
          cp fincheck.py fincheck_pkg/__init__.py
          touch fincheck_pkg/py.typed
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
